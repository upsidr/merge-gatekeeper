---
name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-slim
    permissions:
      actions: read # Tells jobs with the same name in different workflows apart.
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
