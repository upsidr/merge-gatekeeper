---
name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main

jobs:
  merge-gatekeeper:
    # Same runner as the recommended setup, so every PR checks that it works there.
    runs-on: ubuntu-slim
    permissions:
      actions: read # Tells jobs with the same name in different workflows apart.
      checks: read
      statuses: read
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Run Merge Gatekeeper
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
