name: Build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
      - release/v*
    paths:
      - index.js
      - src/**
      - test/**
      - package.json
      - eslint.config.js
      - action.yml
      - version.txt
      - .github/workflows/build-ci.yaml

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No dependencies to install: the action uses Node built-ins only.
      - name: Run Tests
        run: node --test --test-timeout=30000

      # ESLint is fetched here only, so the action stays dependency-free.
      # Pin an exact version that has been out for a few weeks.
      - name: Lint
        env:
          # Takumi Guard: route package fetches through the malware blocklist proxy.
          npm_config_registry: https://npm.flatt.tech
        run: npx --yes eslint@10.14.0 --max-warnings=0 .
