name: Build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
      - release/v*
    paths:
      - index.js
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - .npmrc
      - eslint.config.js
      - action.yml
      - version.txt
      - .github/workflows/build-ci.yaml

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The action uses Node built-ins only; tests need nothing installed.
      - name: Run Tests
        run: node --test --test-timeout=30000

      # Dev tools (ESLint) only, exactly as pinned in package-lock.json.
      # .npmrc routes the fetch through Takumi Guard and disables install scripts.
      - name: Install dev tools
        run: npm ci
      - name: Lint
        run: npm run lint
